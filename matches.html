<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Matches - TeacherSwap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="loader"><div class="loader-spinner"></div><div class="loader-text">Loading...</div></div>
  <div id="toast-container"></div>
  <div id="scroll-progress"></div>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <div class="flex-center gap-2">
        <button id="sidebar-toggle" class="btn btn-ghost btn-icon" style="display:flex;background:none;"><i class="fas fa-bars"></i></button>
        <a href="dashboard.html" class="navbar-brand">
          <div class="brand-icon"><i class="fas fa-arrows-rotate"></i></div>
          <span>TeacherSwap</span>
        </a>
      </div>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"><i class="fas fa-moon" id="theme-icon"></i></button>
        <div class="relative nav-notif-btn">
          <button class="theme-toggle" id="notif-btn" aria-label="Notifications"><i class="fas fa-bell"></i><span class="notif-badge" style="display:none;"></span></button>
          <div class="notif-dropdown" id="notif-dropdown">
            <div class="notif-dropdown-header"><span>Notifications</span></div>
            <div class="notif-dropdown-list"><div class="notif-dropdown-item"><div><p style="font-size:0.85rem;color:var(--text-muted);">Loading notifications...</p></div></div></div>
          </div>
        </div>
        <a href="profile.html" class="btn btn-ghost btn-icon"><i class="fas fa-user-circle"></i></a>
      </div>
    </div>
  </nav>

  <div id="sidebar-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:899;display:none;"></div>

  <!-- Sidebar (populated by nav.js) -->
  <aside class="sidebar" id="sidebar"><div class="sidebar-menu"></div></aside>

  <main class="main-content">
    <div class="page-header">
      <h1>My Matches</h1>
      <p>Teachers most compatible with you, ranked by match score.</p>
    </div>

    <!-- Loading skeleton -->
    <div id="matches-loading" class="dt-recommended-grid">
      <div class="dt-skeleton"></div><div class="dt-skeleton"></div><div class="dt-skeleton"></div>
    </div>

    <!-- Error state -->
    <div id="matches-error" class="card empty-inline" style="display:none;padding:24px;text-align:center;">
      <i class="fas fa-exclamation-triangle" style="font-size:2rem;color:var(--warning);margin-bottom:10px;"></i>
      <p>We couldn't load your matches.</p>
      <button class="btn btn-primary btn-sm" onclick="window.location.reload()"><i class="fas fa-sync-alt"></i> Retry</button>
    </div>

    <!-- Matches grid -->
    <div id="matches-list" class="dt-recommended-grid" style="display:none;">
      <div id="matches-empty" class="card empty-inline" style="grid-column:1/-1;padding:40px;text-align:center;">
        <i class="fas fa-heart-broken" style="font-size:2.5rem;color:var(--text-muted);opacity:0.5;margin-bottom:12px;"></i>
        <p>No matches found yet. Complete your profile or <a href="find-match.html" style="color:var(--primary);">find teachers</a> to build your match list.</p>
      </div>
    </div>
  </main>

  <!-- Mobile Bottom Navigation (populated by nav.js) -->
  <nav class="mobile-bottom-nav" id="mobile-bottom-nav"></nav>

  <div class="lang-toggle" id="lang-toggle">
    <button class="lang-toggle-btn active" data-lang="en">EN</button>
    <button class="lang-toggle-btn" data-lang="sw">SW</button>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
<script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notif.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      if (!api.isLoggedIn()) { window.location.href = 'login.html'; return; }

      var loadingEl = document.getElementById('matches-loading');
      var errorEl = document.getElementById('matches-error');
      var listEl = document.getElementById('matches-list');
      var emptyEl = document.getElementById('matches-empty');

      var matches = [];
      var failed = false;
      try {
        matches = await api.getRecommendations();
      } catch (e) {
        failed = true;
      }

      if (loadingEl) loadingEl.style.display = 'none';
      if (listEl) listEl.style.display = 'block';

      if (failed) {
        if (errorEl) errorEl.style.display = 'block';
        return;
      }

      if (emptyEl) emptyEl.style.display = matches.length ? 'none' : 'block';
      if (!matches.length || !listEl) return;

      // Sort by score descending
      matches.sort(function(a, b) { return (Number(b.score) || 0) - (Number(a.score) || 0); });

      listEl.innerHTML = matches.map(function(r) {
        var score = Number(r.score) || 0;
        var matchClass = score >= 60 ? 'high' : (score >= 40 ? 'medium' : 'low');
        var badge = r.badge ? '<span class="dt-match-badge">' + window.escapeHtml(String(r.badge)) + '</span>' : '';
        var meta = [];
        if (r.subjects) meta.push('<i class="fas fa-chalkboard-teacher"></i> ' + window.escapeHtml(r.subjects));
        if (r.schoolName) meta.push('<i class="fas fa-school"></i> ' + window.escapeHtml(r.schoolName));
        if (r.region) meta.push('<i class="fas fa-map-marker-alt"></i> ' + window.escapeHtml(r.region));
        if (r.teachingLevel) meta.push('<i class="fas fa-graduation-cap"></i> ' + window.escapeHtml(r.teachingLevel));

        var explain = (r.explanation || []).map(function(x) { return '<li>' + window.escapeHtml(x) + '</li>'; }).join('');
        var explainBlock = explain
          ? '<div class="dt-match-explain"><i class="fas fa-lightbulb"></i> Why this match:<ul>' + explain + '</ul></div>'
          : '';

        var swapBtn = r.swapType
          ? '<button class="dt-btn dt-btn-solid request-swap-btn" data-id="' + window.escapeHtml(r.id) + '" data-name="' + window.escapeHtml(r.fullName || '') + '"><i class="fas fa-handshake"></i> Swap</button>'
          : '<a href="profile.html?id=' + encodeURIComponent(r.id) + '" class="dt-btn dt-btn-ghost"><i class="fas fa-user"></i> View</a>';

        return '<div class="dt-match-card">' +
          '<div class="dt-match-top">' +
            '<div class="ts-av ts-av-md">' + window.avatarMarkup(r, 'ts-av-md') + '</div>' +
            '<div class="dt-match-score ' + matchClass + '">' + score + '%</div>' +
          '</div>' +
          '<h4>' + window.escapeHtml(r.fullName || r.email || 'Unknown') + '</h4>' + badge +
          '<div class="dt-match-meta">' + meta.join('<br>') + '</div>' +
          explainBlock +
          '<div class="dt-match-actions">' +
            '<a href="messages.html?teacher=' + encodeURIComponent(r.id) + '" class="dt-btn dt-btn-ghost"><i class="fas fa-comment-dots"></i> Message</a>' +
            swapBtn +
          '</div>' +
        '</div>';
      }).join('');

      // Swap request via modal handled globally below
    });

    // Swap request modal behaviour
    var modalOpen = false;
    document.addEventListener('click', async function(e) {
      var btn = e.target.closest('.request-swap-btn');
      if (!btn) return;
      e.preventDefault();
      var id = btn.getAttribute('data-id');
      var name = btn.getAttribute('data-name') || 'this teacher';
      if (!window.confirm('Send a swap request to ' + name + '? (You can write a message on the profile page.)')) return;
      try {
        await api.sendSwapRequest(id, 'Hello! I would like to arrange a swap with you.');
        showToast('Swap request sent to ' + name, 'success');
      } catch (err) {
        showToast(err.message || 'Could not send swap request', 'error');
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - TeacherSwap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="loader"><div class="loader-spinner"></div><div class="loader-text">Loading...</div></div>
  <div id="toast-container"></div>
  <div id="scroll-progress"></div>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <div class="flex-center gap-2">
        <button id="sidebar-toggle" class="btn btn-ghost btn-icon" style="display:flex;background:none;"><i class="fas fa-bars"></i></button>
        <a href="dashboard.html" class="navbar-brand">
          <div class="brand-icon"><i class="fas fa-arrows-rotate"></i></div>
          <span>TeacherSwap</span>
        </a>
      </div>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"><i class="fas fa-moon" id="theme-icon"></i></button>
        <div class="relative nav-notif-btn">
          <button class="theme-toggle" id="notif-btn" aria-label="Notifications"><i class="fas fa-bell"></i><span class="notif-badge" style="display:none;"></span></button>
          <div class="notif-dropdown" id="notif-dropdown">
            <div class="notif-dropdown-header"><span>Notifications</span></div>
            <div class="notif-dropdown-list"><div class="notif-dropdown-item"><div><p style="font-size:0.85rem;color:var(--text-muted);">Loading notifications...</p></div></div></div>
          </div>
        </div>
        <a href="profile.html" class="btn btn-ghost btn-icon"><i class="fas fa-user-circle"></i></a>
      </div>
    </div>
  </nav>

  <div id="sidebar-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:899;display:none;"></div>

  <!-- Sidebar (populated by nav.js) -->
  <aside class="sidebar" id="sidebar"><div class="sidebar-menu"></div></aside>

  <main class="main-content">
    <div class="page-header">
      <h1>Notifications</h1>
      <p>Stay up to date with swaps, messages, meetings, and more.</p>
      <div style="display:flex;gap:10px;margin-top:12px;">
        <button class="btn btn-primary btn-sm" id="mark-all-btn"><i class="fas fa-check-double"></i> Mark all as read</button>
      </div>
    </div>

    <!-- Loading -->
    <div id="notifs-loading"><div class="card dt-card-message"><i class="fas fa-spinner fa-spin"></i> Loading notifications...</div></div>

    <!-- Error -->
    <div id="notifs-error" class="card dt-card-message" style="display:none;">
      <i class="fas fa-exclamation-triangle" style="color:var(--warning);"></i>
      We couldn't load your notifications. <button class="btn btn-primary btn-sm" onclick="window.location.reload()">Retry</button>
    </div>

    <!-- Empty -->
    <div id="notifs-empty" class="card dt-card-message" style="display:none;">
      <i class="fas fa-bell-slash" style="font-size:2rem;color:var(--text-muted);opacity:0.5;margin-bottom:10px;"></i>
      <p>You're all caught up. No notifications right now.</p>
    </div>

    <!-- List -->
    <div id="notifs-list" style="display:none;"></div>
  </main>

  <!-- Mobile Bottom Navigation (populated by nav.js) -->
  <nav class="mobile-bottom-nav" id="mobile-bottom-nav"></nav>

  <div class="lang-toggle" id="lang-toggle">
    <button class="lang-toggle-btn active" data-lang="en">EN</button>
    <button class="lang-toggle-btn" data-lang="sw">SW</button>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
<script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notif.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      if (!api.isLoggedIn()) { window.location.href = 'login.html'; return; }

      var loadingEl = document.getElementById('notifs-loading');
      var errorEl = document.getElementById('notifs-error');
      var emptyEl = document.getElementById('notifs-empty');
      var listEl = document.getElementById('notifs-list');

      var notifs = [];
      var failed = false;
      try {
        notifs = await api.getNotifications();
      } catch (e) { failed = true; }

      if (loadingEl) loadingEl.style.display = 'none';
      if (failed) { if (errorEl) errorEl.style.display = 'block'; return; }

      if (!notifs.length) {
        if (emptyEl) emptyEl.style.display = 'block';
        return;
      }
      if (listEl) listEl.style.display = 'block';

      var iconMap = { swap_request: 'blue fa-handshake', swap_accepted: 'green fa-check-circle', swap_declined: 'red fa-times-circle', message: 'green fa-comments', meeting: 'purple fa-calendar-check', review: 'yellow fa-star', new_match: 'blue fa-robot' };

      function render() {
        listEl.innerHTML = notifs.map(function(n) {
          var ic = iconMap[n.type] || 'blue fa-bell';
          var parts = ic.split(' ');
          var unread = Number(n.isRead) === 0;
          var link = n.link ? '<a href="' + window.escapeHtml(n.link.replace(/^\//, '')) + '" class="dt-notif-open"><i class="fas fa-arrow-right"></i></a>' : '';
          return '<div class="dt-notif-item' + (unread ? ' unread' : '') + '" data-id="' + window.escapeHtml(n.id) + '">' +
            '<div class="notification-icon ' + parts[0] + '"><i class="fas ' + parts[1] + '"></i></div>' +
            '<div class="notification-content" style="flex:1;cursor:pointer;">' +
              '<p>' + window.escapeHtml(n.body || n.title || '') + '</p>' +
              '<div class="time">' + new Date((n.createdAt || '').replace(' ', 'T')).toLocaleString() + '</div>' +
            '</div>' +
            link +
            (unread ? '<span class="dt-notif-dot"></span>' : '') +
          '</div>';
        }).join('');
      }
      render();

      // Mark individual as read on click
      listEl.addEventListener('click', async function(e) {
        var item = e.target.closest('.dt-notif-item');
        if (!item) return;
        var id = item.getAttribute('data-id');
        if (item.classList.contains('unread')) {
          try { await api.markNotificationRead(id); item.classList.remove('unread'); var d = item.querySelector('.dt-notif-dot'); if (d) d.style.display = 'none'; } catch (er) {}
        }
      });

      // Mark all read
      document.getElementById('mark-all-btn').addEventListener('click', async function() {
        try {
          await api.markAllNotificationsRead();
          notifs.forEach(function(n) { n.isRead = 1; });
          render();
          showToast('All notifications marked as read', 'success');
        } catch (err) {
          showToast(err.message || 'Could not update notifications', 'error');
        }
      });
    });
  </script>
</body>
</html>

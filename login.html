<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeacherSwap - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="loader">
    <div class="loader-content">
      <div class="loader-spinner"></div>
      <div class="loader-text">TeacherSwap</div>
    </div>
  </div>

  <div id="toast-container"></div>

  <button id="back-to-top" aria-label="Back to top"><i class="fas fa-arrow-up"></i></button>

  <button class="auth-theme-toggle" id="theme-toggle" aria-label="Toggle theme">
    <i class="fas fa-moon" id="theme-icon"></i>
  </button>

  <section class="auth-page">
    <div class="auth-bg">
      <div class="gradient-circle gc-1"></div>
      <div class="gradient-circle gc-2"></div>
    </div>
    <div class="auth-container">
      <div class="card auth-card card-glass">
        <div class="auth-logo">
          <div class="brand-icon"><i class="fas fa-arrows-rotate"></i></div>
          <span>TeacherSwap</span>
        </div>
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Sign in to continue your journey</p>

        <form id="login-form" novalidate>
          <div class="form-group">
            <div class="input-icon-wrapper">
              <i class="fas fa-envelope"></i>
              <input type="email" class="form-control" name="email" placeholder="Email address" required>
            </div>
            <span class="form-error"></span>
          </div>

          <div class="form-group">
            <div class="input-icon-wrapper">
              <i class="fas fa-lock"></i>
              <input type="password" class="form-control" name="password" placeholder="Password" required>
              <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <span class="form-error"></span>
          </div>

          <div class="form-row">
            <label class="form-checkbox">
              <input type="checkbox" name="remember">
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Login</button>

          <div class="divider"><span>or continue with</span></div>

          <button type="button" class="btn-social"><i class="fab fa-google"></i> Sign in with Google</button>
        </form>

        <p class="form-footer">Don't have an account? <a href="register.html">Sign up</a></p>
      </div>
    </div>
  </section>

  <script src="js/app.js"></script>
</body>
</html>

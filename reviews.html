<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reviews - TeacherSwap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="loader"><div class="loader-spinner"></div><div class="loader-text">Loading...</div></div>
  <div id="toast-container"></div>
  <div id="scroll-progress"></div>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <div class="flex-center gap-2">
        <button id="sidebar-toggle" class="btn btn-ghost btn-icon" style="display:flex;background:none;"><i class="fas fa-bars"></i></button>
        <a href="dashboard.html" class="navbar-brand">
          <div class="brand-icon"><i class="fas fa-arrows-rotate"></i></div>
          <span>TeacherSwap</span>
        </a>
      </div>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"><i class="fas fa-moon" id="theme-icon"></i></button>
        <div class="relative nav-notif-btn">
          <button class="theme-toggle" id="notif-btn" aria-label="Notifications"><i class="fas fa-bell"></i><span class="notif-badge" style="display:none;"></span></button>
          <div class="notif-dropdown" id="notif-dropdown">
            <div class="notif-dropdown-header"><span>Notifications</span></div>
            <div class="notif-dropdown-list"><div class="notif-dropdown-item"><div><p style="font-size:0.85rem;color:var(--text-muted);">Loading notifications...</p></div></div></div>
          </div>
        </div>
        <a href="profile.html" class="btn btn-ghost btn-icon"><i class="fas fa-user-circle"></i></a>
      </div>
    </div>
  </nav>

  <div id="sidebar-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:899;display:none;"></div>

  <!-- Sidebar (populated by nav.js) -->
  <aside class="sidebar" id="sidebar"><div class="sidebar-menu"></div></aside>

  <main class="main-content">
    <div class="page-header">
      <h1>My Reviews</h1>
      <p>See what teachers have said about you and share feedback after a swap.</p>
    </div>

    <!-- Loading -->
    <div id="reviews-loading"><div class="card dt-card-message"><i class="fas fa-spinner fa-spin"></i> Loading reviews...</div></div>

    <!-- Error -->
    <div id="reviews-error" class="card dt-card-message" style="display:none;">
      <i class="fas fa-exclamation-triangle" style="color:var(--warning);"></i>
      We couldn't load your reviews. <button class="btn btn-primary btn-sm" onclick="window.location.reload()">Retry</button>
    </div>

    <!-- Tabs + content -->
    <div id="reviews-wrap" style="display:none;">
      <div class="dt-tabs" style="margin-bottom:16px;">
        <button class="dt-tab active" data-tab="received"><i class="fas fa-inbox"></i> Received</button>
        <button class="dt-tab" data-tab="written"><i class="fas fa-pen"></i> Reviews I Wrote</button>
        <button class="dt-btn dt-btn-solid" id="new-review-btn" style="margin-left:auto;"><i class="fas fa-plus"></i> Write a Review</button>
      </div>

      <!-- Received panel -->
      <div id="panel-received">
        <div class="stats-cards" id="review-summary"></div>
        <div class="card dashboard-card" style="margin-top:20px;">
          <div class="dashboard-card-header">
            <h3><i class="fas fa-comments text-primary mr-2"></i> Recent Reviews</h3>
          </div>
          <div id="review-list"></div>
        </div>
      </div>

      <!-- Written panel -->
      <div id="panel-written" style="display:none;">
        <div class="card dashboard-card">
          <div class="dashboard-card-header">
            <h3><i class="fas fa-pen text-primary mr-2"></i> Reviews I've Written</h3>
          </div>
          <div id="written-list"><div class="empty-inline" style="padding:24px 0;"><i class="fas fa-pen"></i> You haven't written any reviews yet.</div></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Write Review Modal -->
  <div class="modal-overlay" id="review-modal" style="display:none;">
    <div class="modal" style="max-width:480px;">
      <div class="modal-header">
        <h3>Write a Review</h3>
        <button class="modal-close" id="review-modal-close"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Teacher (from a completed swap)</label>
          <select id="rw-teacher" class="form-control"><option value="">No completed swaps yet</option></select>
        </div>
        <div class="form-group">
          <label>Rating</label>
          <select id="rw-rating" class="form-control">
            <option value="5">5 - Excellent</option>
            <option value="4">4 - Great</option>
            <option value="3">3 - Good</option>
            <option value="2">2 - Fair</option>
            <option value="1">1 - Poor</option>
          </select>
        </div>
        <div class="form-group">
          <label>Feedback</label>
          <textarea id="rw-feedback" class="form-control" rows="3" placeholder="How was the swap experience?"></textarea>
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;cursor:pointer;">
          <input type="checkbox" id="rw-anon" style="width:auto;"> Post anonymously
        </label>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="review-modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="review-submit"><i class="fas fa-paper-plane"></i> Submit Review</button>
      </div>
    </div>
  </div>

  <!-- Mobile Bottom Navigation (populated by nav.js) -->
  <nav class="mobile-bottom-nav" id="mobile-bottom-nav"></nav>

  <div class="lang-toggle" id="lang-toggle">
    <button class="lang-toggle-btn active" data-lang="en">EN</button>
    <button class="lang-toggle-btn" data-lang="sw">SW</button>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notif.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      if (!api.isLoggedIn()) { window.location.href = 'login.html'; return; }

      var me = api.getUser();
      var loadingEl = document.getElementById('reviews-loading');
      var errorEl = document.getElementById('reviews-error');
      var wrapEl = document.getElementById('reviews-wrap');

      function starsHTML(rating) {
        var out = '<span style="color:var(--warning);">';
        for (var i = 1; i <= 5; i++) {
          out += '<i class="fas fa-star' + (i <= rating ? '' : '-o') + '" style="font-size:0.85rem;"></i>';
        }
        out += '</span>';
        return out;
      }

      var data = null;
      var failed = false;
      try {
        data = await api.getUserReviews(me.id);
      } catch (e) { failed = true; }

      if (loadingEl) loadingEl.style.display = 'none';
      if (failed) { if (errorEl) errorEl.style.display = 'block'; return; }
      if (wrapEl) wrapEl.style.display = 'block';

      var reviews = (data && data.reviews) || [];
      var average = Number((data && data.average) || 0).toFixed(1);
      var total = Number((data && data.total) || reviews.length) || 0;

      // Summary cards
      document.getElementById('review-summary').innerHTML =
        '<div class="card stat-card"><div class="stat-card-icon purple"><i class="fas fa-star"></i></div><div class="stat-card-info"><h3>' + average + '</h3><p>Average Rating</p></div></div>' +
        '<div class="card stat-card"><div class="stat-card-icon blue"><i class="fas fa-comments"></i></div><div class="stat-card-info"><h3>' + total + '</h3><p>Total Reviews</p></div></div>';

      // Distribution bars (index 0 = 1-star ... index 4 = 5-star)
      var dist = (data && data.distribution) || [0,0,0,0,0];
      var distHTML = '<div class="card dashboard-card" style="margin-top:20px;"><div class="dashboard-card-header"><h3><i class="fas fa-chart-bar text-primary mr-2"></i> Rating Breakdown</h3></div><div style="padding:8px 4px;">';
      for (var s = 5; s >= 1; s--) {
        var cnt = Number(dist[s-1]) || 0;
        var pct = total ? Math.round((cnt / total) * 100) : 0;
        distHTML += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">' +
          '<span style="min-width:36px;font-size:0.82rem;">' + s + ' <i class="fas fa-star" style="font-size:0.7rem;color:var(--warning);"></i></span>' +
          '<div class="dt-progress" style="flex:1;"><div class="dt-progress-fill" style="width:' + pct + '%;"></div></div>' +
          '<span style="min-width:42px;text-align:right;font-size:0.82rem;color:var(--text-muted);">' + cnt + '</span>' +
        '</div>';
      }
      distHTML += '</div></div>';
      document.getElementById('review-summary').insertAdjacentHTML('afterend', distHTML);

      // Received reviews list
      var listEl = document.getElementById('review-list');
      if (!reviews.length) {
        listEl.innerHTML = '<div class="empty-inline" style="padding:24px 0;"><i class="fas fa-star"></i> No reviews yet. Reviews appear after you complete a swap.</div>';
      } else {
        listEl.innerHTML = reviews.map(function(r) {
          var anon = Number(r.isAnonymous) === 1;
          var name = anon ? 'Anonymous Teacher' : (r.reviewerName || 'Teacher');
          var av = anon ? { fullName: 'Anonymous Teacher', avatar: '' } : { fullName: r.reviewerName || 'Teacher', avatar: r.reviewerAvatar || '' };
          return '<div class="dt-review-item">' +
            '<div class="dt-review-head">' +
              '<div class="ts-av ts-av-xs">' + window.avatarMarkup(av, 'ts-av-xs') + '</div>' +
              '<div style="flex:1;min-width:0;"><h4>' + window.escapeHtml(name) + (anon ? ' <i class="fas fa-eye-slash" title="Anonymous"></i>' : '') + '</h4>' +
              '<div class="dt-request-time">' + new Date((r.createdAt || '').replace(' ', 'T')).toLocaleString() + '</div></div>' +
              starsHTML(Number(r.rating)) +
            '</div>' +
            (r.feedback ? '<p class="dt-review-body">' + window.escapeHtml(r.feedback) + '</p>' : '') +
          '</div>';
        }).join('');
      }

      // ---- Reviews I wrote ----
      var writtenEl = document.getElementById('written-list');
      try {
        var written = await api.getMyWrittenReviews();
        if (!written.length) {
          writtenEl.innerHTML = '<div class="empty-inline" style="padding:24px 0;"><i class="fas fa-pen"></i> You haven\x27t written any reviews yet.</div>';
        } else {
          writtenEl.innerHTML = written.map(function(r) {
            var av = { fullName: r.targetName || 'Teacher', avatar: r.targetAvatar || '' };
            return '<div class="dt-review-item">' +
              '<div class="dt-review-head">' +
                '<div class="ts-av ts-av-xs">' + window.avatarMarkup(av, 'ts-av-xs') + '</div>' +
                '<div style="flex:1;min-width:0;"><h4>To ' + window.escapeHtml(r.targetName || 'Teacher') + '</h4>' +
                '<div class="dt-request-time">' + new Date((r.createdAt || '').replace(' ', 'T')).toLocaleString() + '</div></div>' +
                starsHTML(Number(r.rating)) +
              '</div>' +
              (r.feedback ? '<p class="dt-review-body">' + window.escapeHtml(r.feedback) + '</p>' : '') +
            '</div>';
          }).join('');
        }
      } catch (e) {
        writtenEl.innerHTML = '<div class="empty-inline" style="padding:24px 0;"><i class="fas fa-exclamation-triangle"></i> Could not load reviews you wrote.</div>';
      }

      // ---- Tabs ----
      document.querySelectorAll('.dt-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
          document.querySelectorAll('.dt-tab').forEach(function(t) { t.classList.remove('active'); });
          tab.classList.add('active');
          var target = tab.getAttribute('data-tab');
          document.getElementById('panel-received').style.display = target === 'received' ? 'block' : 'none';
          document.getElementById('panel-written').style.display = target === 'written' ? 'block' : 'none';
        });
      });

      // ---- Write review: gather completed swaps to pick who to review ----
      var swapOptions = [];
      try {
        var requests = await api.getSwapRequests();
        requests.forEach(function(sr) {
          if (sr.status !== 'completed') return;
          var partnerId = sr.fromUserId === me.id ? sr.toUserId : (sr.toUserId === me.id ? sr.fromUserId : null);
          if (!partnerId) return;
          var partnerName = sr.fromUserId === me.id ? sr.toName : sr.fromName;
          swapOptions.push({ swapRequestId: sr.id, toUserId: partnerId, name: partnerName || 'Teacher' });
        });
      } catch (e) { /* ignore */ }

      var teacherSelect = document.getElementById('rw-teacher');
      if (swapOptions.length) {
        teacherSelect.innerHTML = '<option value="">Select a teacher...</option>' + swapOptions.map(function(o) {
          return '<option value="' + window.escapeHtml(o.toUserId) + '" data-swap="' + window.escapeHtml(o.swapRequestId) + '">' + window.escapeHtml(o.name) + '</option>';
        }).join('');
      }

      // Modal open/close
      var modal = document.getElementById('review-modal');
      document.getElementById('new-review-btn').addEventListener('click', function() {
        if (!swapOptions.length) { showToast('Complete a swap before writing a review', 'info'); return; }
        modal.style.display = 'flex';
      });
      document.getElementById('review-modal-close').addEventListener('click', function() { modal.style.display = 'none'; });
      document.getElementById('review-modal-cancel').addEventListener('click', function() { modal.style.display = 'none'; });

      // Submit review
      document.getElementById('review-submit').addEventListener('click', async function() {
        var sel = teacherSelect.options[teacherSelect.selectedIndex];
        var toUserId = teacherSelect.value;
        var swapRequestId = sel ? sel.getAttribute('data-swap') : '';
        var rating = Number(document.getElementById('rw-rating').value) || 5;
        var feedback = document.getElementById('rw-feedback').value.trim();
        var isAnonymous = document.getElementById('rw-anon').checked;
        if (!toUserId || !swapRequestId) { showToast('Please select a teacher', 'error'); return; }
        try {
          await api.submitReview({
            toUserId: toUserId,
            swapRequestId: swapRequestId,
            rating: rating,
            feedback: feedback,
            isAnonymous: isAnonymous
          });
          showToast('Review submitted!', 'success');
          modal.style.display = 'none';
          document.getElementById('rw-feedback').value = '';
          try { writtenEl.innerHTML = ''; var w2 = await api.getMyWrittenReviews(); renderWritten(w2); } catch (e2) {}
          window.location.reload();
        } catch (err) {
          showToast(err.message || 'Could not submit review', 'error');
        }
      });

      function renderWritten(arr) {
        writtenEl.innerHTML = arr.length ? arr.map(function(r) {
          var av = { fullName: r.targetName || 'Teacher', avatar: r.targetAvatar || '' };
          return '<div class="dt-review-item"><div class="dt-review-head"><div class="ts-av ts-av-xs">' + window.avatarMarkup(av, 'ts-av-xs') + '</div><div style="flex:1;min-width:0;"><h4>To ' + window.escapeHtml(r.targetName || 'Teacher') + '</h4><div class="dt-request-time">' + new Date((r.createdAt || '').replace(' ', 'T')).toLocaleString() + '</div></div>' + starsHTML(Number(r.rating)) + '</div>' + (r.feedback ? '<p class="dt-review-body">' + window.escapeHtml(r.feedback) + '</p>' : '') + '</div>';
        }).join('') : '<div class="empty-inline" style="padding:24px 0;"><i class="fas fa-pen"></i> You haven\x27t written any reviews yet.</div>';
      }
    });
  </script>
</body>
</html>

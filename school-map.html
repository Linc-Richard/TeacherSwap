<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Map - TeacherSwap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    #school-map { height: 600px; border-radius: 16px; overflow: hidden; }
    .leaflet-popup-content { font-family: 'Poppins', sans-serif; }
    .leaflet-popup-content h4 { margin: 0 0 4px; font-size: 1rem; }
    .leaflet-popup-content p { margin: 2px 0; font-size: 0.85rem; color: #666; }
    .map-controls { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .map-controls select, .map-controls input { padding: 10px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-family: inherit; min-width: 180px; }
  </style>
</head>
<body>
  <div id="loader"><div class="loader-spinner"></div><div class="loader-text">Loading...</div></div>
  <div id="toast-container"></div>
  <div id="scroll-progress"></div>

  <nav class="navbar" id="navbar">
    <div class="container">
      <div class="flex-center gap-2">
        <button id="sidebar-toggle" class="btn btn-ghost btn-icon" style="display:flex;background:none;"><i class="fas fa-bars"></i></button>
        <a href="dashboard.html" class="navbar-brand"><div class="brand-icon"><i class="fas fa-arrows-rotate"></i></div><span>TeacherSwap</span></a>
      </div>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle"><i class="fas fa-moon" id="theme-icon"></i></button>
        <a href="profile.html" class="btn btn-ghost btn-icon"><i class="fas fa-user-circle"></i></a>
      </div>
    </div>
  </nav>

  <div id="sidebar-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:899;display:none;"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-menu">
      <div class="sidebar-label">Main Menu</div>
      <a href="dashboard.html" class="sidebar-link"><i class="fas fa-th-large"></i> Dashboard</a>
      <a href="find-match.html" class="sidebar-link"><i class="fas fa-search"></i> Find Match</a>
      <a href="school-map.html" class="sidebar-link active"><i class="fas fa-map-marked-alt"></i> School Map</a>
      <a href="messages.html" class="sidebar-link"><i class="fas fa-comments"></i> Messages</a>
      <div class="sidebar-label">Account</div>
      <a href="profile.html" class="sidebar-link"><i class="fas fa-user"></i> Profile</a>
      <a href="login.html" class="sidebar-link logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1>School Map</h1>
      <p>Explore schools across Tanzania that are participating in teacher swaps.</p>
    </div>

    <div class="map-controls">
      <select id="map-region-filter">
        <option value="all">All Regions</option>
      </select>
      <select id="map-level-filter">
        <option value="all">All Levels</option>
        <option value="primary">Primary</option>
        <option value="secondary">Secondary</option>
      </select>
      <input type="number" id="map-radius" placeholder="Radius (km)" value="100" style="min-width:120px;">
      <button class="btn btn-primary" id="map-find-nearby"><i class="fas fa-crosshairs"></i> Find Nearby</button>
    </div>

    <div class="card" style="padding:0;">
      <div id="school-map"></div>
    </div>

    <div class="card" style="margin-top:24px;">
      <div class="dashboard-card-header">
        <h3><i class="fas fa-list text-primary mr-2"></i> Schools Near You</h3>
      </div>
      <div id="school-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding:16px 0;">
        <p style="color:var(--text-muted);">Click a marker or search nearby</p>
      </div>
    </div>
  </main>

  <nav class="mobile-bottom-nav" id="mobile-bottom-nav">
    <a href="index.html" class="mobile-nav-item"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="find-match.html" class="mobile-nav-item"><i class="fas fa-search"></i><span>Find</span></a>
    <a href="school-map.html" class="mobile-nav-item"><i class="fas fa-map-marked-alt"></i><span>Map</span></a>
    <a href="dashboard.html" class="mobile-nav-item"><i class="fas fa-th-large"></i><span>Dashboard</span></a>
    <a href="profile.html" class="mobile-nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
  </nav>
  <div class="lang-toggle" id="lang-toggle">
    <button class="lang-toggle-btn active" data-lang="en">EN</button>
    <button class="lang-toggle-btn" data-lang="sw">SW</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      if (!api.isLoggedIn()) { window.location.href = 'login.html'; return; }

      var map = L.map('school-map').setView([-6.369, 34.8888], 6);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', maxZoom: 18 }).addTo(map);

      var markers = {};
      var regionFilter = document.getElementById('map-region-filter');
      var levelFilter = document.getElementById('map-level-filter');
      var schoolList = document.getElementById('school-list');

      function populateFilter(regions) {
        regions.forEach(function(r) {
          if (r) {
            var opt = document.createElement('option');
            opt.value = r;
            opt.textContent = r;
            regionFilter.appendChild(opt);
          }
        });
      }

      function renderList(schools) {
        schoolList.innerHTML = '';
        if (!schools.length) { schoolList.innerHTML = '<p style="color:var(--text-muted);">No schools found</p>'; return; }
        schools.forEach(function(s) {
          var div = document.createElement('div');
          div.className = 'card';
          div.style.padding = '12px 16px';
          div.innerHTML = '<h4 style="margin:0 0 4px;">' + s.name + '</h4><p style="margin:0;font-size:0.85rem;color:var(--text-muted);">' + s.region + ', ' + s.district + ' &middot; ' + (s.educationLevel || '') + ' &middot; ' + s.subjects + '</p>';
          schoolList.appendChild(div);
        });
      }

      function addMarkers(schools) {
        Object.values(markers).forEach(function(m) { map.removeLayer(m); });
        markers = {};
        schools.forEach(function(s) {
          if (!s.latitude || !s.longitude) return;
          var color = s.educationLevel === 'primary' ? '#10B981' : '#2563EB';
          var icon = L.divIcon({
            className: 'custom-marker',
            html: '<div style="background:' + color + ';color:white;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.3);font-size:14px;"><i class="fas fa-school"></i></div>',
            iconSize: [32, 32],
            iconAnchor: [16, 16]
          });
          var marker = L.marker([s.latitude, s.longitude], { icon: icon }).addTo(map);
          marker.bindPopup('<h4>' + s.name + '</h4><p>' + s.region + ', ' + s.district + '</p><p>' + (s.subjects || '') + '</p><p>' + (s.teacherCount || '') + ' teachers</p>');
          markers[s.id] = marker;
        });
      }

      try {
        var schools = await api.getMapSchools();

        // not using getMapSchools, use getSchools
        var allSchools = await api.getSchools();

        var regions = [...new Set(allSchools.map(function(s) { return s.region; }).filter(Boolean))];
        populateFilter(regions);
        addMarkers(allSchools);
        renderList(allSchools);

        // Filter
        function applyFilters() {
          var region = regionFilter.value;
          var level = levelFilter.value;
          var filtered = allSchools.filter(function(s) {
            if (region !== 'all' && s.region !== region) return false;
            if (level !== 'all' && s.educationLevel !== level) return false;
            return true;
          });
          addMarkers(filtered);
          renderList(filtered);
        }
        regionFilter.addEventListener('change', applyFilters);
        levelFilter.addEventListener('change', applyFilters);

        // Find nearby
        document.getElementById('map-find-nearby').addEventListener('click', function() {
          if (!navigator.geolocation) { showToast('Geolocation not supported', 'error'); return; }
          navigator.geolocation.getCurrentPosition(async function(pos) {
            var radius = parseInt(document.getElementById('map-radius').value) || 50;
            try {
              var nearby = await api.getNearbySchools(pos.coords.latitude, pos.coords.longitude, radius);
              addMarkers(nearby);
              renderList(nearby);
              map.setView([pos.coords.latitude, pos.coords.longitude], 10);
              L.circle([pos.coords.latitude, pos.coords.longitude], { radius: radius * 1000, color: '#2563EB', fillOpacity: 0.1 }).addTo(map);
              showToast('Found ' + nearby.length + ' schools nearby', 'success');
            } catch(e) { showToast('Failed to find nearby schools', 'error'); }
          }, function() { showToast('Could not get location', 'error'); });
        });
      } catch(e) { showToast('Failed to load school map', 'error'); }
    });
  </script>
</body>
</html>

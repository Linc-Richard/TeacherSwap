<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swap Requests - TeacherSwap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="loader"><div class="loader-spinner"></div><div class="loader-text">Loading...</div></div>
  <div id="toast-container"></div>
  <div id="scroll-progress"></div>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <div class="flex-center gap-2">
        <button id="sidebar-toggle" class="btn btn-ghost btn-icon" style="display:flex;background:none;"><i class="fas fa-bars"></i></button>
        <a href="dashboard.html" class="navbar-brand">
          <div class="brand-icon"><i class="fas fa-arrows-rotate"></i></div>
          <span>TeacherSwap</span>
        </a>
      </div>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"><i class="fas fa-moon" id="theme-icon"></i></button>
        <div class="relative nav-notif-btn">
          <button class="theme-toggle" id="notif-btn" aria-label="Notifications"><i class="fas fa-bell"></i><span class="notif-badge" style="display:none;"></span></button>
          <div class="notif-dropdown" id="notif-dropdown">
            <div class="notif-dropdown-header"><span>Notifications</span></div>
            <div class="notif-dropdown-list"><div class="notif-dropdown-item"><div><p style="font-size:0.85rem;color:var(--text-muted);">Loading notifications...</p></div></div></div>
          </div>
        </div>
        <a href="profile.html" class="btn btn-ghost btn-icon"><i class="fas fa-user-circle"></i></a>
      </div>
    </div>
  </nav>

  <div id="sidebar-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:899;display:none;"></div>

  <!-- Sidebar (populated by nav.js) -->
  <aside class="sidebar" id="sidebar"><div class="sidebar-menu"></div></aside>

  <main class="main-content">
    <div class="page-header">
      <h1>Swap Requests</h1>
      <p>Manage swap requests you've sent and received.</p>
    </div>

    <!-- Tabs -->
    <div class="dt-tabs" id="swap-tabs">
      <button class="dt-tab active" data-tab="all">All</button>
      <button class="dt-tab" data-tab="pending">Pending</button>
      <button class="dt-tab" data-tab="accepted">Accepted</button>
      <button class="dt-tab" data-tab="declined">Declined</button>
      <button class="dt-tab" data-tab="completed">Completed</button>
    </div>

    <!-- Loading -->
    <div id="swaps-loading"><div class="card dt-card-message"><i class="fas fa-spinner fa-spin"></i> Loading swap requests...</div></div>

    <!-- Error -->
    <div id="swaps-error" class="card dt-card-message" style="display:none;">
      <i class="fas fa-exclamation-triangle" style="color:var(--warning);"></i>
      We couldn't load your swap requests. <button class="btn btn-primary btn-sm" onclick="window.location.reload()">Retry</button>
    </div>

    <!-- Empty -->
    <div id="swaps-empty" class="card dt-card-message" style="display:none;">
      <i class="fas fa-exchange-alt" style="font-size:2rem;color:var(--text-muted);opacity:0.5;margin-bottom:10px;"></i>
      <p>No swap requests here. <a href="find-match.html" style="color:var(--primary);">Find a teacher</a> to start swapping.</p>
    </div>

    <!-- List -->
    <div id="swaps-list" style="display:none;"></div>
  </main>

  <!-- Mobile Bottom Navigation (populated by nav.js) -->
  <nav class="mobile-bottom-nav" id="mobile-bottom-nav"></nav>

  <div class="lang-toggle" id="lang-toggle">
    <button class="lang-toggle-btn active" data-lang="en">EN</button>
    <button class="lang-toggle-btn" data-lang="sw">SW</button>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notif.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      if (!api.isLoggedIn()) { window.location.href = 'login.html'; return; }

      var me = api.getUser();
      var allRequests = [];
      var currentTab = 'all';
      var loadingEl = document.getElementById('swaps-loading');
      var errorEl = document.getElementById('swaps-error');
      var emptyEl = document.getElementById('swaps-empty');
      var listEl = document.getElementById('swaps-list');

      var failed = false;
      try {
        allRequests = await api.getSwapRequests();
      } catch (e) {
        failed = true;
      }

      if (loadingEl) loadingEl.style.display = 'none';
      if (listEl) listEl.style.display = 'block';
      if (failed) { if (errorEl) errorEl.style.display = 'block'; return; }
      if (!allRequests.length) { if (emptyEl) emptyEl.style.display = 'block'; return; }

      function statusIcon(status) {
        return { pending: 'fa-clock', accepted: 'fa-handshake', declined: 'fa-times-circle', completed: 'fa-check-circle', cancelled: 'fa-ban' }[status] || 'fa-exchange-alt';
      }
      function statusColor(status) {
        return { pending: 'pending', accepted: 'accepted', declined: 'declined', completed: 'completed', cancelled: 'declined' }[status] || 'pending';
      }

      function render() {
        var list = allRequests;
        if (currentTab !== 'all') list = list.filter(function(s) { return s.status === currentTab; });
        if (!list.length) {
          listEl.innerHTML = '<div class="card dt-card-message"><i class="fas fa-inbox" style="font-size:1.6rem;color:var(--text-muted);opacity:0.5;margin-bottom:8px;"></i><p>No ' + currentTab + ' swap requests.</p></div>';
          return;
        }
        listEl.innerHTML = list.map(function(s) {
          var other = s.toUserId === me.id ? s.fromName : s.toName;
          var otherId = s.toUserId === me.id ? s.fromUserId : s.toUserId;
          var iAmRecipient = s.toUserId === me.id;
          var canRespond = iAmRecipient && s.status === 'pending';
          var canComplete = s.status === 'accepted';
          var canCancel = !iAmRecipient && s.status === 'pending';

          var actions = '';
          if (canRespond) {
            actions = '<div class="dt-actions">' +
              '<button class="dt-btn dt-btn-solid act-btn" data-id="' + window.escapeHtml(s.id) + '" data-act="accepted"><i class="fas fa-check"></i> Accept</button>' +
              '<button class="dt-btn dt-btn-danger-outline act-btn" data-id="' + window.escapeHtml(s.id) + '" data-act="declined"><i class="fas fa-times"></i> Decline</button>' +
            '</div>';
          } else if (canComplete) {
            actions = '<div class="dt-actions"><button class="dt-btn dt-btn-solid act-btn" data-id="' + window.escapeHtml(s.id) + '" data-act="completed"><i class="fas fa-check-circle"></i> Mark Complete</button></div>';
          } else if (canCancel) {
            actions = '<div class="dt-actions"><button class="dt-btn dt-btn-danger-outline act-btn" data-id="' + window.escapeHtml(s.id) + '" data-act="cancelled"><i class="fas fa-ban"></i> Cancel</button></div>';
          }

          return '<div class="card dt-request-card">' +
            '<div class="dt-request-main">' +
              '<div class="ts-av ts-av-sm">' + window.avatarMarkup({ fullName: other, avatar: '' }, 'ts-av-sm') + '</div>' +
              '<div style="flex:1;min-width:0;">' +
                '<h4>' + window.escapeHtml(other || 'Unknown') + '</h4>' +
                '<p class="dt-request-meta">' +
                  (s.message ? window.escapeHtml(s.message) : '<i>' + (iAmRecipient ? 'Incoming swap request' : 'Swap request sent') + '</i>') +
                '</p>' +
                '<div class="dt-request-time"><i class="fas fa-clock"></i> ' + new Date((s.createdAt || '').replace(' ', 'T')).toLocaleString() + ' &middot; ' + (iAmRecipient ? 'Received' : 'Sent') + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="dt-request-side">' +
              '<span class="request-status ' + statusColor(s.status) + '"><i class="fas ' + statusIcon(s.status) + '"></i> ' + window.escapeHtml(s.status) + '</span>' +
              actions +
            '</div>' +
          '</div>';
        }).join('');
      }

      render();

      // Tab switch
      document.querySelectorAll('.dt-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
          document.querySelectorAll('.dt-tab').forEach(function(x) { x.classList.remove('active'); });
          tab.classList.add('active');
          currentTab = tab.getAttribute('data-tab');
          render();
        });
      });

      // Action buttons
      document.addEventListener('click', async function(e) {
        var btn = e.target.closest('.act-btn');
        if (!btn) return;
        var id = btn.getAttribute('data-id');
        var act = btn.getAttribute('data-act');
        var label = { accepted: 'accept', declined: 'decline', completed: 'mark complete', cancelled: 'cancel' }[act] || act;
        showToast('Updating swap request...', 'info');
        try {
          await api.updateSwapRequest(id, act);
          showToast('Swap request ' + label + 'd', 'success');
          allRequests = await api.getSwapRequests();
          render();
        } catch (err) {
          showToast(err.message || 'Update failed', 'error');
        }
      });
    });
  </script>
</body>
</html>

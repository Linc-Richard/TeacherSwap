<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meetings - TeacherSwap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="loader"><div class="loader-spinner"></div><div class="loader-text">Loading...</div></div>
  <div id="toast-container"></div>
  <div id="scroll-progress"></div>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <div class="flex-center gap-2">
        <button id="sidebar-toggle" class="btn btn-ghost btn-icon" style="display:flex;background:none;"><i class="fas fa-bars"></i></button>
        <a href="dashboard.html" class="navbar-brand">
          <div class="brand-icon"><i class="fas fa-arrows-rotate"></i></div>
          <span>TeacherSwap</span>
        </a>
      </div>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"><i class="fas fa-moon" id="theme-icon"></i></button>
        <div class="relative nav-notif-btn">
          <button class="theme-toggle" id="notif-btn" aria-label="Notifications"><i class="fas fa-bell"></i><span class="notif-badge" style="display:none;"></span></button>
          <div class="notif-dropdown" id="notif-dropdown">
            <div class="notif-dropdown-header"><span>Notifications</span></div>
            <div class="notif-dropdown-list"><div class="notif-dropdown-item"><div><p style="font-size:0.85rem;color:var(--text-muted);">Loading notifications...</p></div></div></div>
          </div>
        </div>
        <a href="profile.html" class="btn btn-ghost btn-icon"><i class="fas fa-user-circle"></i></a>
      </div>
    </div>
  </nav>

  <div id="sidebar-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:899;display:none;"></div>

  <!-- Sidebar (populated by nav.js) -->
  <aside class="sidebar" id="sidebar"><div class="sidebar-menu"></div></aside>

  <main class="main-content">
    <div class="page-header">
      <h1>Meetings</h1>
      <p>Schedule and manage swap-planning meetings with other teachers.</p>
      <div style="display:flex;gap:10px;margin-top:12px;">
        <button class="btn btn-primary btn-sm" id="new-meeting-btn"><i class="fas fa-plus"></i> Schedule a Meeting</button>
      </div>
    </div>

    <!-- Loading -->
    <div id="meetings-loading"><div class="card dt-card-message"><i class="fas fa-spinner fa-spin"></i> Loading meetings...</div></div>

    <!-- Error -->
    <div id="meetings-error" class="card dt-card-message" style="display:none;">
      <i class="fas fa-exclamation-triangle" style="color:var(--warning);"></i>
      We couldn't load your meetings. <button class="btn btn-primary btn-sm" onclick="window.location.reload()">Retry</button>
    </div>

    <!-- Empty -->
    <div id="meetings-empty" class="card dt-card-message" style="display:none;">
      <i class="fas fa-calendar-check" style="font-size:2rem;color:var(--text-muted);opacity:0.5;margin-bottom:10px;"></i>
      <p>No meetings scheduled yet. Plan a meeting with a teacher to arrange your swap.</p>
    </div>

    <!-- List -->
    <div id="meetings-list" style="display:none;"></div>
  </main>

  <!-- New Meeting Modal -->
  <div class="modal-overlay" id="meeting-modal" style="display:none;">
    <div class="modal" style="max-width:480px;">
      <div class="modal-header">
        <h3>Schedule a Meeting</h3>
        <button class="modal-close" id="meeting-modal-close"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Teacher (invite to meet)</label>
          <select id="m-teacher" class="form-control"><option value="">Select a teacher...</option></select>
        </div>
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="m-title" class="form-control" placeholder="e.g. Swap Planning Discussion">
        </div>
        <div class="form-row" style="display:flex;gap:12px;flex-wrap:wrap;">
          <div class="form-group" style="flex:1;min-width:130px;">
            <label>Date</label>
            <input type="date" id="m-date" class="form-control">
          </div>
          <div class="form-group" style="flex:1;min-width:110px;">
            <label>Time</label>
            <input type="time" id="m-time" class="form-control">
          </div>
          <div class="form-group" style="flex:1;min-width:110px;">
            <label>Duration (min)</label>
            <input type="number" id="m-duration" class="form-control" value="30" min="15" step="15">
          </div>
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" id="m-location" class="form-control" placeholder="e.g. Online / School name">
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea id="m-notes" class="form-control" rows="2" placeholder="Optional notes"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="meeting-modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="meeting-submit"><i class="fas fa-calendar-plus"></i> Schedule</button>
      </div>
    </div>
  </div>

  <!-- Mobile Bottom Navigation (populated by nav.js) -->
  <nav class="mobile-bottom-nav" id="mobile-bottom-nav"></nav>

  <div class="lang-toggle" id="lang-toggle">
    <button class="lang-toggle-btn active" data-lang="en">EN</button>
    <button class="lang-toggle-btn" data-lang="sw">SW</button>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notif.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      if (!api.isLoggedIn()) { window.location.href = 'login.html'; return; }

      var me = api.getUser();
      var allMeetings = [];
      var loadingEl = document.getElementById('meetings-loading');
      var errorEl = document.getElementById('meetings-error');
      var emptyEl = document.getElementById('meetings-empty');
      var listEl = document.getElementById('meetings-list');

      function statusColor(status) {
        return { accepted: 'accepted', pending: 'pending', rejected: 'declined', cancelled: 'declined', rescheduled: 'pending' }[status] || 'pending';
      }

      function render() {
        if (!allMeetings.length) { emptyEl.style.display = 'block'; listEl.style.display = 'none'; return; }
        emptyEl.style.display = 'none';
        listEl.style.display = 'block';
        listEl.innerHTML = allMeetings.map(function(m) {
          var otherId = m.requesterId === me.id ? m.responderId : m.requesterId;
          var iAmResponder = m.responderId === me.id;
          var canRespond = iAmResponder && m.status === 'pending';
          var canCancel = !iAmResponder && (m.status === 'pending' || m.status === 'accepted');

          var actions = '';
          if (canRespond) {
            actions = '<div class="dt-actions">' +
              '<button class="dt-btn dt-btn-solid mt-act" data-id="' + window.escapeHtml(m.id) + '" data-act="accepted"><i class="fas fa-check"></i> Accept</button>' +
              '<button class="dt-btn dt-btn-danger-outline mt-act" data-id="' + window.escapeHtml(m.id) + '" data-act="rejected"><i class="fas fa-times"></i> Reject</button>' +
            '</div>';
          } else if (canCancel) {
            actions = '<div class="dt-actions"><button class="dt-btn dt-btn-danger-outline mt-act" data-id="' + window.escapeHtml(m.id) + '" data-act="cancelled"><i class="fas fa-ban"></i> Cancel</button></div>';
          }

          var dt = (m.date ? window.escapeHtml(m.date) : '') + (m.time ? ' at ' + window.escapeHtml(m.time) : '');
          var extra = '';
          if (m.location) extra += '<div class="dt-request-meta"><i class="fas fa-map-marker-alt"></i> ' + window.escapeHtml(m.location) + '</div>';
          if (m.videoLink) extra += '<div class="dt-request-meta"><i class="fas fa-video"></i> <a href="' + window.escapeHtml(m.videoLink) + '" target="_blank" rel="noopener">Join video</a></div>';
          if (m.notes) extra += '<div class="dt-request-meta"><i class="fas fa-sticky-note"></i> ' + window.escapeHtml(m.notes) + '</div>';

          return '<div class="card dt-request-card">' +
            '<div class="dt-request-main">' +
              '<div class="ts-av ts-av-sm">' + window.avatarMarkup({ fullName: (iAmResponder ? '' : ''), avatar: '' }, 'ts-av-sm') + '</div>' +
              '<div style="flex:1;min-width:0;">' +
                '<h4><i class="fas fa-calendar" style="color:var(--primary);margin-right:6px;"></i>' + window.escapeHtml(m.title || 'Meeting') + '</h4>' +
                '<div class="dt-request-meta"><i class="fas fa-clock"></i> ' + dt + ' &middot; ' + (m.duration ? m.duration + ' min' : '') + '</div>' +
                '<div class="dt-request-meta"><i class="fas fa-user"></i> ' + (iAmResponder ? 'Requested by you' : 'Meeting with another teacher') + ' &middot; ' + (iAmResponder ? 'you organize' : 'you') + '</div>' +
                extra +
              '</div>' +
            '</div>' +
            '<div class="dt-request-side">' +
              '<span class="request-status ' + statusColor(m.status) + '"><i class="fas ' + ({pending:'fa-clock',accepted:'fa-check-circle',rejected:'fa-times-circle',cancelled:'fa-ban',rescheduled:'fa-calendar-minus'}[m.status]||'fa-calendar') + '"></i> ' + window.escapeHtml(m.status) + '</span>' +
              actions +
            '</div>' +
          '</div>';
        }).join('');
      }

      var failed = false;
      try {
        allMeetings = await api.getMeetings();
      } catch (e) { failed = true; }
      if (loadingEl) loadingEl.style.display = 'none';
      if (failed) { if (errorEl) errorEl.style.display = 'block'; return; }
      render();

      // Populate teacher dropdown from recommendations for scheduling
      var teacherSelect = document.getElementById('m-teacher');
      try {
        var recs = await api.getRecommendations();
        if (recs.length) {
          teacherSelect.innerHTML = '<option value="">Select a teacher...</option>' + recs.map(function(r) {
            return '<option value="' + window.escapeHtml(r.id) + '">' + window.escapeHtml(r.fullName || r.email || '') + ' (' + (Number(r.score)||0) + '% match)</option>';
          }).join('');
        }
      } catch (e) { /* leave select empty */ }

      // Modal open/close
      var modal = document.getElementById('meeting-modal');
      document.getElementById('new-meeting-btn').addEventListener('click', function() { modal.style.display = 'flex'; });
      document.getElementById('meeting-modal-close').addEventListener('click', function() { modal.style.display = 'none'; });
      document.getElementById('meeting-modal-cancel').addEventListener('click', function() { modal.style.display = 'none'; });
      if (modal.querySelector('.modal-overlay')) {}

      // Submit new meeting
      document.getElementById('meeting-submit').addEventListener('click', async function() {
        var responderId = document.getElementById('m-teacher').value;
        var title = document.getElementById('m-title').value.trim();
        var date = document.getElementById('m-date').value;
        var time = document.getElementById('m-time').value;
        if (!responderId) { showToast('Please select a teacher', 'error'); return; }
        if (!title) { showToast('Please enter a title', 'error'); return; }
        if (!date || !time) { showToast('Please pick a date and time', 'error'); return; }
        try {
          await api.createMeeting({
            responderId: responderId,
            title: title,
            date: date,
            time: time,
            duration: Number(document.getElementById('m-duration').value) || 30,
            location: document.getElementById('m-location').value.trim(),
            notes: document.getElementById('m-notes').value.trim()
          });
          showToast('Meeting scheduled!', 'success');
          modal.style.display = 'none';
          allMeetings = await api.getMeetings();
          render();
        } catch (err) {
          showToast(err.message || 'Could not schedule meeting', 'error');
        }
      });

      // Meeting status actions
      document.addEventListener('click', async function(e) {
        var btn = e.target.closest('.mt-act');
        if (!btn) return;
        var id = btn.getAttribute('data-id');
        var act = btn.getAttribute('data-act');
        showToast('Updating meeting...', 'info');
        try {
          await api.updateMeeting(id, { status: act });
          showToast('Meeting updated', 'success');
          allMeetings = await api.getMeetings();
          render();
        } catch (err) {
          showToast(err.message || 'Update failed', 'error');
        }
      });
    });
  </script>
</body>
</html>

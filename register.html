<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeacherSwap - Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="loader">
    <div class="loader-content">
      <div class="loader-spinner"></div>
      <div class="loader-text">TeacherSwap</div>
    </div>
  </div>

  <div id="toast-container"></div>

  <button id="back-to-top" aria-label="Back to top"><i class="fas fa-arrow-up"></i></button>

  <!-- Mobile Bottom Navigation -->
  <nav class="mobile-bottom-nav" id="mobile-bottom-nav">
    <a href="index.html" class="mobile-nav-item"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="find-match.html" class="mobile-nav-item"><i class="fas fa-search"></i><span>Find</span></a>
    <a href="dashboard.html" class="mobile-nav-item"><i class="fas fa-th-large"></i><span>Dashboard</span></a>
    <a href="messages.html" class="mobile-nav-item"><i class="fas fa-comments"></i><span>Messages</span></a>
    <a href="profile.html" class="mobile-nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
  </nav>
  <div class="lang-toggle" id="lang-toggle">
    <button class="lang-toggle-btn active" data-lang="en">EN</button>
    <button class="lang-toggle-btn" data-lang="sw">SW</button>
  </div>

  <button class="auth-theme-toggle" id="theme-toggle" aria-label="Toggle theme">
    <i class="fas fa-moon" id="theme-icon"></i>
  </button>

  <section class="auth-page">
    <div class="auth-bg">
      <div class="gradient-circle gc-1"></div>
      <div class="gradient-circle gc-2"></div>
    </div>

    <div class="auth-container">
      <div class="card auth-card card-glass">

        <div class="auth-logo">
          <div class="brand-icon"><i class="fas fa-arrows-rotate"></i></div>
          <span>TeacherSwap</span>
        </div>
        <h2 class="auth-title" data-i18n="Create Account">Create Account</h2>
        <p class="auth-subtitle" data-i18n="Join the teacher community in Tanzania">Join the teacher community in Tanzania</p>

        <!-- Registration Content -->
        <div id="registration-form-content">

          <!-- Progress Steps -->
          <div class="progress-bar">
            <div class="progress-step active">
              <div class="step-indicator">1</div>
              <span class="step-label">Personal</span>
            </div>
            <div class="progress-step">
              <div class="step-indicator">2</div>
              <span class="step-label">Teaching</span>
            </div>
            <div class="progress-step">
              <div class="step-indicator">3</div>
              <span class="step-label">School</span>
            </div>
            <div class="progress-step">
              <div class="step-indicator">4</div>
              <span class="step-label">Preferences</span>
            </div>
          </div>

          <form id="register-form" novalidate>

            <!-- Step 1: Personal -->
            <div class="step-content active" id="step-1">
              <div class="form-group">
                <div class="input-icon-wrapper">
                  <i class="fas fa-user"></i>
                  <input type="text" class="form-control" name="fullName" placeholder="Full Name" data-i18n="Full Name" required>
                </div>
                <span class="form-error"></span>
              </div>
              <div class="form-group">
                <div class="input-icon-wrapper">
                  <i class="fas fa-envelope"></i>
                  <input type="email" class="form-control" name="email" placeholder="Email address" required>
                </div>
                <span class="form-error"></span>
              </div>
              <div class="form-group">
                <div class="input-icon-wrapper">
                  <i class="fas fa-phone"></i>
                  <input type="tel" class="form-control" name="phone" placeholder="Phone number" data-i18n="Phone number" required>
                </div>
                <span class="form-error"></span>
              </div>
              <div class="form-group">
                <div class="input-icon-wrapper">
                  <i class="fas fa-lock"></i>
                  <input type="password" class="form-control" id="reg-password" name="password" placeholder="Password" required>
                  <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                    <i class="fas fa-eye"></i>
                  </button>
                </div>
                <span class="form-error"></span>
              </div>
              <div class="form-group">
                <div class="input-icon-wrapper">
                  <i class="fas fa-lock"></i>
                  <input type="password" class="form-control" id="confirm-password" name="confirmPassword" placeholder="Confirm Password" required>
                  <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                    <i class="fas fa-eye"></i>
                  </button>
                </div>
                <span class="form-error"></span>
              </div>
            </div>

            <!-- Step 2: Teaching -->
            <div class="step-content" id="step-2">
              <div class="form-group">
                <div class="input-icon-wrapper">
                  <i class="fas fa-id-card"></i>
                  <input type="text" class="form-control" name="tscNumber" placeholder="TSC Number" required>
                </div>
                <span class="form-error"></span>
              </div>
              <div class="form-group">
                <div class="input-icon-wrapper">
                  <i class="fas fa-venus-mars"></i>
                  <select class="form-control" name="gender" required style="padding-left:44px;">
                    <option value="" disabled selected>Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                  </select>
                </div>
                <span class="form-error"></span>
              </div>
              <div class="form-group">
                <div class="input-icon-wrapper">
                  <i class="fas fa-graduation-cap"></i>
                  <select class="form-control" name="teachingLevel" required style="padding-left:44px;">
                    <option value="" disabled selected>Teaching Level</option>
                    <option value="primary">Primary</option>
                    <option value="secondary">Secondary</option>
                    <option value="both">Both</option>
                  </select>
                </div>
                <span class="form-error"></span>
              </div>
              <div class="form-group">
                <div class="input-icon-wrapper">
                  <i class="fas fa-book"></i>
                  <input type="text" class="form-control" name="subjects" placeholder="Subjects (comma separated)" required>
                </div>
                <span class="form-error"></span>
              </div>
              <div class="form-group">
                <div class="input-icon-wrapper">
                  <i class="fas fa-briefcase"></i>
                  <select class="form-control" name="experience" required style="padding-left:44px;">
                    <option value="" disabled selected>Years of Experience</option>
                    <option value="0-2">0-2 years</option>
                    <option value="3-5">3-5 years</option>
                    <option value="6-10">6-10 years</option>
                    <option value="10+">10+ years</option>
                  </select>
                </div>
                <span class="form-error"></span>
              </div>
            </div>

            <!-- Step 3: School -->
            <div class="step-content" id="step-3">
              <div class="form-group">
                <div class="input-icon-wrapper">
                  <i class="fas fa-school"></i>
                  <input type="text" class="form-control" name="schoolName" placeholder="School Name" required>
                </div>
                <span class="form-error"></span>
              </div>
              <div class="form-group">
                <div class="input-icon-wrapper">
                  <i class="fas fa-map-marker-alt"></i>
                  <select class="form-control" name="region" required style="padding-left:44px;">
                    <option value="" disabled selected>Select Region</option>
                    <option value="Arusha">Arusha</option>
                    <option value="Dar es Salaam">Dar es Salaam</option>
                    <option value="Dodoma">Dodoma</option>
                    <option value="Geita">Geita</option>
                    <option value="Iringa">Iringa</option>
                    <option value="Kagera">Kagera</option>
                    <option value="Katavi">Katavi</option>
                    <option value="Kigoma">Kigoma</option>
                    <option value="Kilimanjaro">Kilimanjaro</option>
                    <option value="Lindi">Lindi</option>
                    <option value="Manyara">Manyara</option>
                    <option value="Mara">Mara</option>
                    <option value="Mbeya">Mbeya</option>
                    <option value="Mjini Magharibi">Mjini Magharibi</option>
                    <option value="Morogoro">Morogoro</option>
                    <option value="Mtwara">Mtwara</option>
                    <option value="Mwanza">Mwanza</option>
                    <option value="Njombe">Njombe</option>
                    <option value="Pemba North">Pemba North</option>
                    <option value="Pemba South">Pemba South</option>
                    <option value="Pwani">Pwani</option>
                    <option value="Rukwa">Rukwa</option>
                    <option value="Ruvuma">Ruvuma</option>
                    <option value="Shinyanga">Shinyanga</option>
                    <option value="Simiyu">Simiyu</option>
                    <option value="Singida">Singida</option>
                    <option value="Songwe">Songwe</option>
                    <option value="Tabora">Tabora</option>
                    <option value="Tanga">Tanga</option>
                    <option value="Unguja North">Unguja North</option>
                    <option value="Unguja South">Unguja South</option>
                  </select>
                </div>
                <span class="form-error"></span>
              </div>
              <div class="form-group">
                <div class="input-icon-wrapper">
                  <i class="fas fa-map-pin"></i>
                  <input type="text" class="form-control" name="district" placeholder="District" required>
                </div>
                <span class="form-error"></span>
              </div>
            </div>

            <!-- Step 4: Preferences -->
            <div class="step-content" id="step-4">
              <div class="form-group">
                <div class="input-icon-wrapper">
                  <i class="fas fa-map-marker-alt"></i>
                  <select class="form-control" name="preferredRegion" style="padding-left:44px;">
                    <option value="" disabled selected>Preferred Region</option>
                    <option value="Arusha">Arusha</option>
                    <option value="Dar es Salaam">Dar es Salaam</option>
                    <option value="Dodoma">Dodoma</option>
                    <option value="Iringa">Iringa</option>
                    <option value="Kagera">Kagera</option>
                    <option value="Kigoma">Kigoma</option>
                    <option value="Kilimanjaro">Kilimanjaro</option>
                    <option value="Mbeya">Mbeya</option>
                    <option value="Morogoro">Morogoro</option>
                    <option value="Mwanza">Mwanza</option>
                    <option value="Tanga">Tanga</option>
                    <option value="Pwani">Pwani</option>
                  </select>
                </div>
                <span class="form-error"></span>
              </div>
              <div class="form-group">
                <div class="input-icon-wrapper">
                  <i class="fas fa-map-pin"></i>
                  <input type="text" class="form-control" name="preferredDistrict" placeholder="Preferred District">
                </div>
                <span class="form-error"></span>
              </div>
              <div class="form-group">
                <div class="input-icon-wrapper">
                  <i class="fas fa-comment"></i>
                  <textarea class="form-control" name="reason" placeholder="Reason for swap" rows="4" style="padding-left:44px;padding-top:14px;"></textarea>
                </div>
                <span class="form-error"></span>
              </div>
              <div class="form-group">
                <div class="input-icon-wrapper">
                  <i class="fas fa-exchange-alt"></i>
                  <select class="form-control" name="swapType" style="padding-left:44px;">
                    <option value="" disabled selected>Swap Type</option>
                    <option value="permanent">Permanent</option>
                    <option value="temporary">Temporary</option>
                    <option value="either">Either</option>
                  </select>
                </div>
                <span class="form-error"></span>
              </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="btn-row" style="display:flex;gap:12px;margin-top:24px;">
              <button type="button" class="btn btn-ghost" id="prev-step" style="display:none;"><i class="fas fa-arrow-left"></i> <span data-i18n="Previous">Previous</span></button>
              <button type="button" class="btn btn-primary" id="next-step" style="flex:1;"><span data-i18n="Next">Next</span> <i class="fas fa-arrow-right"></i></button>
              <button type="submit" class="btn btn-primary" id="submit-reg" style="display:none;flex:1;"><i class="fas fa-check"></i> <span data-i18n="Complete Registration">Complete Registration</span></button>
            </div>

          </form>
        </div>

        <!-- Success State -->
        <div class="success-state" style="display:none;" id="registration-success">
          <div class="success-checkmark"></div>
          <div style="text-align:center;padding:20px 0;">
            <div class="success-icon-glow" style="margin-bottom:16px;">
              <i class="fas fa-check-circle" style="font-size:4rem;color:var(--success);filter:drop-shadow(0 0 20px rgba(16,185,129,0.5));"></i>
            </div>
            <h2 style="font-size:1.5rem;font-weight:700;margin-bottom:8px;background:linear-gradient(135deg,var(--success),var(--primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Registration Successful!</h2>
            <p style="color:var(--text-muted);">Welcome to TeacherSwap! Redirecting to dashboard...</p>
          </div>
        </div>

        <div class="divider"><span data-i18n="or sign up with">or sign up with</span></div>

          <div id="google-register-button"></div>

        <p class="form-footer" data-i18n="Already have an account?">Already have an account? <a href="login.html" data-i18n="Sign in">Sign in</a></p>

      </div>
    </div>
  </section>

  <script src="js/api.js"></script>
  <script src="js/google-auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var form = document.getElementById('register-form');
      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        if (!validateStep(currentStep)) { showToast('Please fill all required fields', 'error'); return; }
        var data = {};
        form.querySelectorAll('.form-control').forEach(function(el) {
          var name = el.getAttribute('name');
          if (name) data[name] = el.value;
        });
        delete data.confirmPassword;
        try {
          var result = await api.register(data);
          showToast('Registration successful! Welcome to TeacherSwap!', 'success');
          fireConfetti(80);
          document.getElementById('registration-form-content').style.display = 'none';
          document.getElementById('registration-success').style.display = 'block';
          setTimeout(function() { window.location.href = 'login.html'; }, 2500);
        } catch (err) {
          showToast(err.message, 'error');
        }
      });

      // Google Sign-Up
      async function handleGoogleCredential(credential) {
        try {
          var data = await api.request('POST', '/auth/google', { credential: credential });
          api.saveUser(data.user);
          localStorage.setItem('ts-token', data.token);
          showToast('Signed up with Google! Welcome!', 'success');
          fireConfetti(50);
          setTimeout(function() { window.location.href = 'dashboard.html'; }, 1000);
        } catch(err) {
          showToast(err.message || 'Google sign-up failed', 'error');
        }
      }

      googleAuth.init('471699141629-6iod43adbvqdpfu75g7hupceenu2ft6m.apps.googleusercontent.com', handleGoogleCredential);
      googleAuth.renderButton('google-register-button');
    });
  </script>
</body>
</html>
